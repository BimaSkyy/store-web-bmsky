<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BmSkySocial</title>
<meta name="description" content="Layanan sosial media TikTok, Instagram, YouTube dan akun premium dengan harga jelas. Pesan lewat WhatsApp.">
<meta name="theme-color" content="#A9D0FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231A64DB'/%3E%3Cpath d='M18 44V20h14a7 7 0 0 1 3 13 7.5 7.5 0 0 1-3 11H18z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07214D;
  --ink-soft:#35568A;
  --blue:#1A64DB;
  --blue-dark:#1455B8;
  --tint:#DCEBFF;
  --ok:#0E6B43;
  --ok-bg:#DDF5E8;
  --rule:rgba(7,33,77,.16);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  font-size:1.0625rem;
  color:var(--ink);
  line-height:1.5;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  background-color:#F3F9FF;
  background-image:linear-gradient(180deg,#A9D0FF 0,#CBE3FF 380px,#F3F9FF 820px);
  background-repeat:no-repeat;
}
body::before{
  content:"";
  position:absolute;inset:0 0 auto 0;height:600px;pointer-events:none;
  background:
    radial-gradient(280px 90px at 10% 14%,rgba(255,255,255,.8),transparent 70%),
    radial-gradient(360px 110px at 84% 8%,rgba(255,255,255,.75),transparent 70%),
    radial-gradient(320px 100px at 66% 40%,rgba(255,255,255,.5),transparent 70%);
}
a{color:inherit}
.wrap{position:relative;max-width:980px;margin:0 auto;padding:0 1.2rem}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.9rem 1.5rem;padding:1.4rem 0 0}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;text-decoration:none}
.nav{display:flex;gap:1.4rem;overflow-x:auto;max-width:100%;padding:.2rem 2px}
.nav a{
  white-space:nowrap;text-decoration:none;font-weight:600;font-size:1rem;
  padding:.35rem 0;border-bottom:2px solid transparent;
}
.nav a:hover{border-bottom-color:var(--rule)}
.nav a[aria-current="page"]{border-bottom-color:var(--ink)}

/* hero */
.hero{padding:3.6rem 0 2.6rem;animation:rise .7s ease both}
.hero h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(2.3rem,7.4vw,4.4rem);line-height:1.03;letter-spacing:-.035em;
  max-width:16ch;
}
.hero p{margin-top:1.1rem;max-width:44ch;font-size:1.15rem;color:var(--ink-soft)}
.hero .btn{margin-top:1.7rem}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  font:700 1rem var(--body);text-decoration:none;white-space:nowrap;
  padding:.85rem 1.5rem;border-radius:999px;border:2px solid var(--blue);
  background:var(--blue);color:#fff;cursor:pointer;
  transition:background .15s,transform .15s;
}
.btn:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* section heading */
.section{padding:1.2rem 0 1.6rem}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.3rem 1rem;margin-bottom:1rem}
.section-head h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;letter-spacing:-.03em}
.section-head a{color:var(--blue);font-weight:700;text-underline-offset:4px}

/* card grid: kiri kanan */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.card{
  display:flex;flex-direction:column;
  background:#fff;
  border:1px solid rgba(26,100,219,.14);
  border-radius:22px;
  padding:1.15rem 1.15rem 1.1rem;
  box-shadow:0 14px 32px -22px rgba(10,50,120,.45);
}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:1rem}
.ico{
  width:46px;height:46px;border-radius:14px;background:var(--tint);color:var(--blue);
  display:grid;place-items:center;flex:none;
}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{
  font-size:.85rem;font-weight:700;color:var(--ok);background:var(--ok-bg);
  padding:.2rem .65rem;border-radius:999px;white-space:nowrap;
}
.name{font-weight:700;font-size:1.1rem;line-height:1.3}
.qty{color:var(--ink-soft);font-size:1rem;margin-top:.15rem}
.warranty{color:var(--ink);font-size:.95rem;font-weight:600;margin-top:.5rem}
.price{
  font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.1;letter-spacing:-.02em;
  margin:1.1rem 0 .9rem;white-space:nowrap;
}
.notes{margin-bottom:1rem}
.notes summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:.97rem;padding:.15rem 0}
.notes ul{margin-top:.5rem;padding-left:1.1rem;color:var(--ink-soft);font-size:.95rem;line-height:1.5}
.notes li+li{margin-top:.3rem}
.card .btn{margin-top:auto;width:100%;padding:.7rem .6rem;font-size:.97rem}
.card .btn svg{display:none}

/* how to order */
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:1.6rem;padding:2.2rem 0 0;border-top:2px solid var(--ink)}
.steps b{display:block;font-family:var(--display);font-size:1.25rem;margin-bottom:.2rem}
.steps span{color:var(--ink-soft)}

.foot{padding:2.8rem 0 3rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem;font-size:1rem}
.foot strong{color:var(--ink)}

.missing{padding:3rem 0}
.missing h1{font-family:var(--display);font-size:2.3rem;font-weight:800;letter-spacing:-.03em}
.missing p{margin:.6rem 0 1.4rem;color:var(--ink-soft)}

@media (min-width:860px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem}
}
@media (max-width:560px){
  body{font-size:1rem}
  .hero{padding:2.4rem 0 2rem}
  .section-head h2{font-size:1.7rem}
  .grid{gap:.8rem}
  .card{padding:1rem .9rem .9rem;border-radius:20px}
  .card-top{margin-bottom:.8rem}
  .ico{width:42px;height:42px}
  .name{font-size:1.02rem}
  .qty{font-size:.92rem}
  .warranty{font-size:.9rem}
  .price{font-size:1.45rem}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .hero{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">BmSkySocial</a>
    <nav class="nav" id="nav" aria-label="Pilih layanan"></nav>
  </header>
  <main id="app"></main>
  <footer class="foot">
    <span>Pesanan diproses lewat WhatsApp <strong>083132988099</strong></span>
    <span>Baca catatan dan garansi di tiap produk sebelum memesan.</span>
  </footer>
</div>

<script>
(function () {
  var WA_NUMBER = "6283132988099";

  function waLink(service) {
    return "https://wa.me/" + WA_NUMBER + "?text=" +
      encodeURIComponent("hallo sir mau order " + service + " dong");
  }

  var ICONS = {
    likes: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
    views: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    subscribe: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    followers: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    favorites: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    comments: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    palette: '<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.5-.7-.5-1.1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.9-4.5-9-10-9z"/>',
    sparkle: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/>',
    film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 12h18"/>',
    chat: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.5 8.5 0 1 1 21 11.5z"/>'
  };

  function icon(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  // price = harga (Rupiah). Item sosmed: qty + unit. Item premium: sub, service, tag, warranty, notes.
  var DATA = {
    tiktok: {
      name: "TikTok",
      title: "Layanan TikTok",
      desc: "Views, likes, followers, favorites, dan comments-hearts untuk video TikTok kamu.",
      items: [
        { name: "TikTok Views", icon: "views", price: 2000, qty: "1.000", unit: "views" },
        { name: "TikTok Likes", icon: "heart", price: 1000, qty: "50", unit: "likes" },
        { name: "TikTok Followers", icon: "followers", price: 2000, qty: "50", unit: "followers" },
        { name: "TikTok Favorites", icon: "favorites", price: 1000, qty: "200", unit: "favorites" },
        { name: "Comments-Hearts", icon: "comments", price: 1000, qty: "20", unit: "comments-hearts" }
      ]
    },
    instagram: {
      name: "Instagram",
      title: "Layanan Instagram",
      desc: "Tambah likes dan followers untuk akun dan postingan Instagram.",
      items: [
        { name: "Instagram Likes", icon: "heart", price: 2000, qty: "500", unit: "likes" },
        { name: "Instagram Followers", icon: "followers", price: 5000, qty: "100", unit: "followers" }
      ]
    },
    youtube: {
      name: "YouTube",
      title: "Layanan YouTube",
      desc: "Likes, views, dan subscribe untuk video dan channel YouTube.",
      items: [
        { name: "YouTube Likes", icon: "likes", price: 5000, qty: "100", unit: "likes" },
        { name: "YouTube Views", icon: "views", price: 2000, qty: "100", unit: "views" },
        { name: "YouTube Subscribe", icon: "subscribe", price: 5000, qty: "50", unit: "subscribe" }
      ]
    },
    premium: {
      name: "Akun Premium",
      nav: "Premium",
      title: "Akun Premium",
      order: "akun premium",
      desc: "Canva Pro Edu, Gemini Pro, dan Alight Motion. Garansi dan syarat tertera di tiap produk.",
      items: [
        {
          name: "Canva Pro Edu Invite", icon: "palette", price: 10000,
          sub: "Lifetime, ikut masa aktif akun utama",
          service: "CANVA PRO EDU INVITE - LIFETIME",
          tag: "Ready", warranty: "Garansi 1 bulan",
          notes: [
            "Masa aktif mengikuti akun utama (tidak ada batas waktu tertentu, aktif dalam waktu yang lama)",
            "Via invite akun",
            "Bisa pindahkan desain lama",
            "Bisa upload font, brand kit, dan color palette (termasuk fitur PPT dan lainnya)"
          ]
        },
        {
          name: "Canva Pro Edu Head", icon: "palette", price: 45000,
          sub: "Lifetime",
          service: "CANVA PRO EDU HEAD - LIFETIME",
          tag: "Ready", warranty: "Garansi 7 hari",
          notes: [
            "Tujuan diisi dengan email pengguna, contoh: jamal@gmail.com",
            "Bisa invite sampai 500 member, fitur Pro terbuka",
            "Bisa pindahkan desain lama"
          ]
        },
        {
          name: "Gemini 12 Bulan", icon: "sparkle", price: 12000,
          sub: "Via invite",
          service: "GEMINI 12 BULAN - INVITE",
          tag: "Ready", warranty: "Garansi backfree 1x24 jam",
          notes: [
            "Garansi backfree 1x24 jam",
            "Tidak ada garansi limit"
          ]
        },
        {
          name: "Gemini Pro 18 Bulan", icon: "sparkle", price: 20000,
          sub: "Via redeem code",
          service: "GEMINI PRO 18 BULAN - REDEEM CODE",
          tag: "Ready", warranty: "Cukup klik link satu kali",
          notes: [
            "Cukup klik link satu kali",
            "Tidak perlu pembayaran atau VCC"
          ]
        },
        {
          name: "Alight Motion Premium", icon: "film", price: 3000,
          sub: "1 Tahun",
          service: "Alight Motion Premium 1 Tahun",
          tag: "Ready", warranty: "Garansi 3 bulan",
          notes: [
            "Tujuan diisi dengan email pengguna, contoh: jamal@gmail.com",
            "Garansi 3 bulan"
          ]
        }
      ]
    }
  };
  var ORDER = ["tiktok", "instagram", "youtube", "premium"];

  // Format: Rp 1.000 (titik sebagai pemisah ribuan, tidak bergantung locale HP)
  function rupiah(n) {
    return "Rp\u00A0" + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  function orderBtn(service) {
    return '<a class="btn" href="' + waLink(service) +
      '" target="_blank" rel="noopener">' + icon("chat") + 'Pesan Sekarang</a>';
  }

  function cardHtml(item) {
    var service = item.service || (item.name + " paket " + item.qty);
    var sub = item.sub || (item.qty + " " + item.unit);
    var notes = "";
    if (item.notes && item.notes.length) {
      notes = '<details class="notes"><summary>Lihat catatan</summary><ul>' +
        item.notes.map(function (n) { return "<li>" + n + "</li>"; }).join("") +
        "</ul></details>";
    }
    return '<article class="card">' +
      '<div class="card-top"><div class="ico">' + icon(item.icon) + '</div>' +
      (item.tag ? '<span class="badge">' + item.tag + '</span>' : '') + '</div>' +
      '<h3 class="name">' + item.name + '</h3>' +
      '<div class="qty">' + sub + '</div>' +
      (item.warranty ? '<div class="warranty">' + item.warranty + '</div>' : '') +
      '<div class="price">' + rupiah(item.price) + '</div>' +
      notes +
      orderBtn(service) +
      '</article>';
  }

  function gridHtml(slug) {
    return '<div class="grid">' + DATA[slug].items.map(cardHtml).join("") + '</div>';
  }

  function sectionHtml(slug) {
    var p = DATA[slug];
    return '<section class="section" aria-labelledby="h-' + slug + '">' +
      '<div class="section-head"><h2 id="h-' + slug + '">' + p.name + '</h2>' +
      '<a href="/service/' + slug + '">Buka halaman ' + p.name + '</a></div>' +
      gridHtml(slug) + '</section>';
  }

  var STEPS = '<ol class="steps">' +
    '<li><b>1. Pilih produk</b><span>Cari layanan atau akun yang kamu butuhkan di daftar harga.</span></li>' +
    '<li><b>2. Klik Pesan Sekarang</b><span>WhatsApp terbuka dengan pesan yang sudah terisi.</span></li>' +
    '<li><b>3. Kirim data pesanan</b><span>Kirim link atau email sesuai catatan produk, lalu lanjut pembayaran.</span></li>' +
    '</ol>';

  function setMeta(title, desc) {
    document.title = title;
    var m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute("content", desc);
  }

  function renderNav(active) {
    var links = [{ href: "/", label: "Semua", key: "all" }].concat(
      ORDER.map(function (s) {
        return { href: "/service/" + s, label: DATA[s].nav || DATA[s].name, key: s };
      })
    );
    document.getElementById("nav").innerHTML = links.map(function (l) {
      return '<a href="' + l.href + '"' + (l.key === active ? ' aria-current="page"' : '') + '>' + l.label + '</a>';
    }).join("");
  }

  function renderHome() {
    renderNav("all");
    setMeta("BmSkySocial | Layanan Sosial Media dan Akun Premium",
      "Daftar harga layanan TikTok, Instagram, YouTube, dan akun premium. Pesan lewat WhatsApp.");
    document.getElementById("app").innerHTML =
      '<section class="hero">' +
        '<h1>Layanan sosial media dan akun premium</h1>' +
        '<p>Pilih paket untuk TikTok, Instagram, YouTube, atau akun premium. Klik Pesan Sekarang dan lanjutkan lewat WhatsApp.</p>' +
        orderBtn("layanan BmSkySocial") +
      '</section>' +
      ORDER.map(sectionHtml).join("") +
      STEPS;
  }

  function renderPlatform(slug) {
    var p = DATA[slug];
    renderNav(slug);
    setMeta(p.title + " | BmSkySocial",
      "Daftar harga " + p.title + " di BmSkySocial. Pesan lewat WhatsApp.");
    document.getElementById("app").innerHTML =
      '<section class="hero">' +
        '<h1>' + p.title + '</h1>' +
        '<p>' + p.desc + '</p>' +
        orderBtn(p.order || p.name) +
      '</section>' +
      '<section class="section" aria-label="Daftar harga ' + p.name + '">' + gridHtml(slug) + '</section>' +
      STEPS;
  }

  function renderMissing() {
    renderNav("");
    setMeta("Halaman tidak ditemukan | BmSkySocial", "Halaman tidak ditemukan.");
    document.getElementById("app").innerHTML =
      '<section class="missing"><h1>Halaman tidak ditemukan</h1>' +
      '<p>Layanan yang kamu cari belum tersedia. Pilih dari daftar layanan yang ada.</p>' +
      '<a class="btn" href="/">Lihat semua layanan</a></section>';
  }

  var path = location.pathname.replace(/\/+$/, "").toLowerCase();
  var m = path.match(/^\/service\/([^\/]+)$/);

  if (path === "" || path === "/index.html" || path === "/service") {
    renderHome();
  } else if (m && DATA[m[1]]) {
    renderPlatform(m[1]);
  } else {
    renderMissing();
  }
})();
</script>
</body>
</html>
