<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BmSkySocial</title>
<meta name="description" content="Layanan sosial media TikTok, Instagram, dan YouTube dengan harga jelas per paket. Pesan lewat WhatsApp.">
<meta name="theme-color" content="#B9D9FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231A64DB'/%3E%3Cpath d='M18 44V20h14a7 7 0 0 1 3 13 7.5 7.5 0 0 1-3 11H18z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07214D;
  --ink-soft:#40608F;
  --blue:#1A64DB;
  --blue-dark:#1455B8;
  --sky:#EEF6FF;
  --sky-2:#D3E6FF;
  --line:#D9E8FB;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  color:var(--ink);
  line-height:1.5;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  background-color:var(--sky);
  background-image:linear-gradient(180deg,#B3D6FF 0,#D5E8FF 460px,var(--sky) 760px);
  background-repeat:no-repeat;
}
body::before{
  content:"";
  position:absolute;inset:0 0 auto 0;height:640px;pointer-events:none;
  background:
    radial-gradient(280px 90px at 10% 16%,rgba(255,255,255,.85),transparent 70%),
    radial-gradient(360px 110px at 82% 9%,rgba(255,255,255,.8),transparent 70%),
    radial-gradient(320px 100px at 64% 44%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(260px 80px at 18% 58%,rgba(255,255,255,.5),transparent 70%);
}
a{color:inherit}
.wrap{position:relative;max-width:960px;margin:0 auto;padding:0 1.25rem}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.9rem 1.5rem;padding:1.4rem 0 0}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.03em;text-decoration:none}
.nav{display:flex;gap:.4rem;overflow-x:auto;max-width:100%;padding:2px}
.nav a{
  white-space:nowrap;text-decoration:none;font-weight:600;font-size:.95rem;
  padding:.5rem 1rem;border-radius:999px;background:rgba(255,255,255,.6);
}
.nav a:hover{background:#fff}
.nav a[aria-current="page"]{background:var(--ink);color:#fff}

/* hero */
.hero{padding:3.6rem 0 2.4rem;animation:rise .7s ease both}
.hero h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(2.3rem,7.2vw,4.4rem);line-height:1.02;letter-spacing:-.035em;
  max-width:17ch;
}
.hero p{margin-top:1.1rem;max-width:46ch;font-size:1.1rem;color:var(--ink-soft)}
.hero .btn{margin-top:1.7rem}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  font:600 1rem var(--body);text-decoration:none;white-space:nowrap;
  padding:.8rem 1.4rem;border-radius:999px;border:1.5px solid var(--blue);
  background:var(--blue);color:#fff;cursor:pointer;
  transition:background .15s,color .15s,transform .15s;
}
.btn:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:transparent;color:var(--blue);padding:.6rem 1.1rem;font-size:.95rem}
.btn.ghost:hover{background:var(--blue);color:#fff}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* price panels */
.panel{
  background:rgba(255,255,255,.84);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.95);
  border-radius:28px;
  box-shadow:0 26px 60px -30px rgba(10,50,120,.4);
  padding:.35rem 1.5rem .5rem;margin-bottom:1.5rem;
}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.2rem 0 1rem}
.panel-head h2{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.025em}
.panel-head a{color:var(--blue);font-weight:600;font-size:.95rem;text-underline-offset:3px}
.row{
  display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;gap:1rem;
  padding:1rem 0;border-top:1px solid var(--line);
}
.ico{width:48px;height:48px;border-radius:50%;background:var(--sky-2);color:var(--blue);display:grid;place-items:center}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.name{font-weight:700;font-size:1.05rem;line-height:1.25}
.qty{color:var(--ink-soft);font-size:.92rem}
.price{font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;text-align:right;min-width:6.5rem}

/* how to order */
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:2.6rem 0 0}
.steps li{padding-top:.9rem;border-top:2px solid var(--ink);font-size:.98rem}
.steps b{display:block;font-family:var(--display);font-size:1.1rem;margin-bottom:.15rem}
.steps span{color:var(--ink-soft)}

.foot{padding:2.6rem 0 3rem;color:var(--ink-soft);font-size:.92rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem}
.foot strong{color:var(--ink)}

.missing{padding:3rem 0}
.missing h1{font-family:var(--display);font-size:2.2rem;font-weight:800;letter-spacing:-.03em}
.missing p{margin:.6rem 0 1.4rem;color:var(--ink-soft)}

@media (max-width:600px){
  .hero{padding:2.4rem 0 1.8rem}
  .panel{padding:.2rem 1.1rem .4rem;border-radius:24px}
  .row{
    grid-template-columns:48px 1fr auto;
    grid-template-areas:"i t p" "b b b";
    gap:.7rem 1rem;
  }
  .row .ico{grid-area:i}
  .row .info{grid-area:t}
  .row .price{grid-area:p;min-width:0}
  .row .btn{grid-area:b;width:100%}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .hero{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">BmSkySocial</a>
    <nav class="nav" id="nav" aria-label="Pilih layanan"></nav>
  </header>
  <main id="app"></main>
  <footer class="foot">
    <span>Pesanan diproses lewat WhatsApp <strong>083132988099</strong></span>
    <span>Tidak perlu password akun, cukup kirim link.</span>
  </footer>
</div>

<script>
(function () {
  var WA_NUMBER = "6283132988099";

  function waLink(service) {
    return "https://wa.me/" + WA_NUMBER + "?text=" +
      encodeURIComponent("hallo sir mau order " + service + " dong");
  }

  var ICONS = {
    likes: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
    views: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    subscribe: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    followers: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    favorites: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    comments: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    chat: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.5 8.5 0 1 1 21 11.5z"/>'
  };

  function icon(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  // price = harga (Rupiah) untuk satu paket, qty = jumlah per paket
  var DATA = {
    tiktok: {
      name: "TikTok",
      desc: "Views, likes, followers, favorites, dan comments-hearts untuk video TikTok kamu.",
      items: [
        { name: "TikTok Views", icon: "views", price: 2000, qty: "1.000", unit: "views" },
        { name: "TikTok Likes", icon: "heart", price: 1000, qty: "50", unit: "likes" },
        { name: "TikTok Followers", icon: "followers", price: 2000, qty: "50", unit: "followers" },
        { name: "TikTok Favorites", icon: "favorites", price: 1000, qty: "200", unit: "favorites" },
        { name: "Comments-Hearts", icon: "comments", price: 1000, qty: "20", unit: "comments-hearts" }
      ]
    },
    instagram: {
      name: "Instagram",
      desc: "Tambah likes dan followers untuk akun dan postingan Instagram.",
      items: [
        { name: "Instagram Likes", icon: "heart", price: 2000, qty: "500", unit: "likes" },
        { name: "Instagram Followers", icon: "followers", price: 5000, qty: "100", unit: "followers" }
      ]
    },
    youtube: {
      name: "YouTube",
      desc: "Likes, views, dan subscribe untuk video dan channel YouTube.",
      items: [
        { name: "YouTube Likes", icon: "likes", price: 5000, qty: "100", unit: "likes" },
        { name: "YouTube Views", icon: "views", price: 2000, qty: "100", unit: "views" },
        { name: "YouTube Subscribe", icon: "subscribe", price: 5000, qty: "50", unit: "subscribe" }
      ]
    }
  };
  var ORDER = ["tiktok", "instagram", "youtube"];

  function rupiah(n) {
    return "Rp" + Number(n).toLocaleString("id-ID");
  }

  function orderBtn(service, extraClass) {
    return '<a class="btn ' + (extraClass || "") + '" href="' + waLink(service) +
      '" target="_blank" rel="noopener">' + icon("chat") + 'Pesan Sekarang</a>';
  }

  function rowHtml(item) {
    var service = item.name + " paket " + item.qty;
    return '<div class="row">' +
      '<div class="ico">' + icon(item.icon) + '</div>' +
      '<div class="info"><div class="name">' + item.name + '</div>' +
      '<div class="qty">' + item.qty + ' ' + item.unit + ' per paket</div></div>' +
      '<div class="price">' + rupiah(item.price) + '</div>' +
      orderBtn(service, "ghost") +
      '</div>';
  }

  function panelHtml(slug, withLink) {
    var p = DATA[slug];
    return '<section class="panel" aria-labelledby="h-' + slug + '">' +
      '<div class="panel-head"><h2 id="h-' + slug + '">' + p.name + '</h2>' +
      (withLink ? '<a href="/service/' + slug + '">Buka halaman ' + p.name + '</a>' : '') +
      '</div>' + p.items.map(rowHtml).join("") + '</section>';
  }

  var STEPS = '<ol class="steps">' +
    '<li><b>Pilih layanan</b><span>Cari paket yang kamu butuhkan di daftar harga.</span></li>' +
    '<li><b>Klik Pesan Sekarang</b><span>WhatsApp terbuka dengan pesan yang sudah terisi.</span></li>' +
    '<li><b>Kirim link</b><span>Kirim link akun atau video, lalu lanjut pembayaran.</span></li>' +
    '</ol>';

  function setMeta(title, desc) {
    document.title = title;
    var m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute("content", desc);
  }

  function renderNav(active) {
    var links = [{ href: "/", label: "Semua", key: "all" }].concat(
      ORDER.map(function (s) {
        return { href: "/service/" + s, label: DATA[s].name, key: s };
      })
    );
    document.getElementById("nav").innerHTML = links.map(function (l) {
      return '<a href="' + l.href + '"' + (l.key === active ? ' aria-current="page"' : '') + '>' + l.label + '</a>';
    }).join("");
  }

  function renderHome() {
    renderNav("all");
    setMeta("BmSkySocial | Layanan TikTok, Instagram, dan YouTube",
      "Daftar harga layanan sosial media TikTok, Instagram, dan YouTube. Pesan lewat WhatsApp.");
    document.getElementById("app").innerHTML =
      '<section class="hero">' +
        '<h1>Layanan sosial media dengan harga yang jelas</h1>' +
        '<p>Pilih paket untuk TikTok, Instagram, atau YouTube. Klik Pesan Sekarang dan lanjutkan lewat WhatsApp.</p>' +
        orderBtn("layanan sosial media") +
      '</section>' +
      ORDER.map(function (s) { return panelHtml(s, true); }).join("") +
      STEPS;
  }

  function renderPlatform(slug) {
    var p = DATA[slug];
    renderNav(slug);
    setMeta("Layanan " + p.name + " | BmSkySocial",
      "Daftar harga layanan " + p.name + " di BmSkySocial. Pesan lewat WhatsApp.");
    document.getElementById("app").innerHTML =
      '<section class="hero">' +
        '<h1>Layanan ' + p.name + '</h1>' +
        '<p>' + p.desc + '</p>' +
        orderBtn(p.name) +
      '</section>' +
      panelHtml(slug, false) +
      STEPS;
  }

  function renderMissing() {
    renderNav("");
    setMeta("Halaman tidak ditemukan | BmSkySocial", "Halaman tidak ditemukan.");
    document.getElementById("app").innerHTML =
      '<section class="missing"><h1>Halaman tidak ditemukan</h1>' +
      '<p>Layanan yang kamu cari belum tersedia. Pilih dari daftar layanan yang ada.</p>' +
      '<a class="btn" href="/">Lihat semua layanan</a></section>';
  }

  var path = location.pathname.replace(/\/+$/, "").toLowerCase();
  var m = path.match(/^\/service\/([^\/]+)$/);

  if (path === "" || path === "/index.html" || path === "/service") {
    renderHome();
  } else if (m && DATA[m[1]]) {
    renderPlatform(m[1]);
  } else {
    renderMissing();
  }
})();
</script>
</body>
</html>
